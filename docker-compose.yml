services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/is-audit
      JWT_SECRET: ${JWT_SECRET:-replace_this_with_a_long_random_string}
      JWT_EXPIRES_IN: 7d
      CLIENT_ORIGIN: http://localhost:5000
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@company.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-ChangeMe123!}
    volumes:
      - uploads:/app/server/uploads
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
  uploads:
